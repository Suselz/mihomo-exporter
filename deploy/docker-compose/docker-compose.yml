services:
  mihomo-exporter:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: mihomo-exporter
    restart: unless-stopped
    environment:
      MIHOMO_URL: http://10.66.0.2:9090
      MIHOMO_CONNECTIONS_PATH: /connections
      EXPORTER_LISTEN_ADDR: :9109
      EXPORTER_METRICS_PATH: /metrics
      EXPORTER_SCRAPE_INTERVAL: 2s
      EXPORTER_MAX_CLIENT_SERIES: 2000
    ports:
      - "9109:9109"
