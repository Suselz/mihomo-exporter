name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build release binaries
        run: |
          set -euo pipefail
          mkdir -p dist

          VERSION="${GITHUB_REF_NAME}"
          for target in \
            linux/amd64 \
            linux/arm64 \
            darwin/amd64 \
            darwin/arm64 \
            windows/amd64
          do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            BIN_NAME="mihomo-exporter"
            EXT=""
            if [ "$GOOS" = "windows" ]; then
              EXT=".exe"
            fi

            OUT_DIR="dist/${BIN_NAME}_${VERSION}_${GOOS}_${GOARCH}"
            mkdir -p "$OUT_DIR"

            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "${OUT_DIR}/${BIN_NAME}${EXT}" ./cmd/mihomo-exporter

            if [ "$GOOS" = "windows" ]; then
              (cd dist && zip -r "${BIN_NAME}_${VERSION}_${GOOS}_${GOARCH}.zip" "${BIN_NAME}_${VERSION}_${GOOS}_${GOARCH}")
            else
              tar -C dist -czf "dist/${BIN_NAME}_${VERSION}_${GOOS}_${GOARCH}.tar.gz" "${BIN_NAME}_${VERSION}_${GOOS}_${GOARCH}"
            fi
            rm -rf "$OUT_DIR"
          done

          (cd dist && sha256sum ./* > checksums.txt)

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
